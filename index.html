<!DOCTYPE html>
<html>
<head>
<title>Instagram Demo</title>

<style>
body{
    background:#fafafa;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    
    height:100vh;
}

.box{
    width:350px;
    background:white;
    border:1px solid #2f1212;
    padding:40px;
    text-align:center;
}

.logo{
    font-size:35px;
    font-family:cursive;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin:5px 0;
    border:1px solid #dbdbdb;
    background:#fafafa;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    background:#0095f6;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.signup{
    margin-top:20px;
    font-size:14px;
}
</style>

</head>
<body>

<div class="box">
    <div class="logo">Instagram</div>

    <input type="text" placeholder="Phone number, username, or email">

    <input type="password" placeholder="Password">

    <button onclick="demo()">Log In</button>

    <div class="signup">
        Don't have an account? <b>Sign up</b>
    </div>
</div>

<script>
function demo(){
    alert("This is only a UI demo.");
}
</script>

</body>
</html>
